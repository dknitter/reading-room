<style>:root {
  color-scheme: light;
  --paper: #F4F5F7;
  --surface: #FFFFFF;
  --knowledge-wash: #ECF1FF;
  --ink: #17181C;
  --ink-2: #565A63;
  --rule: #DFE2E7;
  --accent-text: #D61F5F;
  --tape-pink: #FF3D7F;
  --tape-blue: #2E5BFF;
  --tape-yellow: #FFC21A;
  --tape-green: #12A66B;
  --tape-orange: #FF6B1A;
  --tape-black: #17181C;
  --tape-black-text: #FFFFFF;
  --tape-ink: #17181C;
  --closed-fill: #E7E9ED;
  --control-rule: #757984;
  --tape-cut: polygon(0 0, 100% 0, 98.5% 42%, 100% 52%, 100% 100%, 0 100%, 1.5% 63%, 0 54%);
  --tape-texture: repeating-linear-gradient(112deg, transparent 0 2px, rgba(0, 0, 0, .025) 2px 3px);
  --display-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei Light", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --label-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --number-font: "DIN Alternate", "DIN Condensed", "Avenir Next", system-ui, sans-serif;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #17181B;
    --surface: #202126;
    --knowledge-wash: #222B46;
    --ink: #ECEDEF;
    --ink-2: #A3A7AF;
    --rule: #33353B;
    --accent-text: #FF7AA8;
    --tape-black: #ECEDEF;
    --tape-black-text: #17181C;
    --closed-fill: #303239;
    --control-rule: #797D88;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #17181B;
  --surface: #202126;
  --knowledge-wash: #222B46;
  --ink: #ECEDEF;
  --ink-2: #A3A7AF;
  --rule: #33353B;
  --accent-text: #FF7AA8;
  --tape-black: #ECEDEF;
  --tape-black-text: #17181C;
  --closed-fill: #303239;
  --control-rule: #797D88;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-size: 1.0625rem; line-height: 1.75; overflow-wrap: anywhere; }
a { color: var(--accent-text); text-underline-offset: .2em; }
a:hover { text-decoration-thickness: .12em; }
:focus { outline: 2px solid var(--accent-text); outline-offset: 2px; }
@supports selector(:focus-visible) {
  :focus:not(:focus-visible) { outline: none; }
}
button, input, select, textarea { font: inherit; color: inherit; }
button, select, summary { cursor: pointer; }
input:not([type="checkbox"]), select, textarea {
  min-height: 44px;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  padding: .35rem .7rem;
  font-size: 1rem;
  background: var(--surface);
  border: 1px solid var(--control-rule);
  border-radius: .4rem;
}
input[type="checkbox"] { accent-color: var(--accent-text); width: 1.125rem; height: 1.125rem; flex: 0 0 auto; margin: 0; }
button {
  min-width: 44px;
  min-height: 44px;
  padding: .45rem .75rem;
  border: 1px solid var(--control-rule);
  border-radius: .4rem;
  color: var(--ink);
  background: var(--surface);
  font-weight: 600;
  line-height: 1.2;
}
button:hover { border-color: var(--accent-text); }
button:disabled { opacity: .75; cursor: wait; }
button [lang="en"] { display: block; margin-top: .18rem; }

h1, h2, h3, h4, p, ul, ol { margin: 0 0 .85em; }
h1, h2, h3, h4 { font-weight: 650; line-height: 1.3; }
h1 {
  font: 300 clamp(2.25rem, 6vw, 2.5rem)/1.15 var(--display-font);
  letter-spacing: .02em;
}
h2 { font-size: 1.45rem; }
h3 { font-size: 1.125rem; }
h4 { font-size: 1rem; }
ul, ol { padding-inline-start: 1.45em; }
li { margin-bottom: .3em; }
p:last-child, ul:last-child, ol:last-child { margin-bottom: 0; }

.eyebrow, h1 > [lang="en"], h2 > [lang="en"], .detail-section > h2 > span, .dossier-panel > summary > span,
.sheet-head h2 > span, .chip-group legend > span {
  color: var(--ink-2);
  font: 600 .75rem/1.4 var(--label-font);
  letter-spacing: .14em;
  text-transform: uppercase;
}
h1 > [lang="en"] { display: block; margin-top: .7rem; }
h2 > .translation { text-transform: none; letter-spacing: 0; }
.muted, .translation, .empty-value { color: var(--ink-2); }
.translation { display: block; margin-top: .15em; font-size: .83em; font-weight: 500; letter-spacing: 0; }
.numerals, time, .ranking-facts dd, .salary-facts dd { font-family: var(--number-font); font-variant-numeric: tabular-nums; }

.primary { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.primary [lang="en"] { color: inherit; }
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.tape {
  --tape-angle: -1.2deg;
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: .22em;
  max-width: 100%;
  min-height: 24px;
  padding: 2px 8px;
  color: var(--tape-text, var(--tape-ink));
  font-size: .78125rem;
  font-weight: 650;
  line-height: 1.2;
  transform: rotate(var(--tape-angle));
}
.tape::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: var(--tape-texture), var(--tape-fill, var(--surface));
  clip-path: var(--tape-cut);
}
.tape:nth-child(even), .scroll-chips > :nth-child(even) .tape { --tape-angle: .8deg; }
.tape-pink { --tape-fill: var(--tape-pink); }
.tape-blue { --tape-fill: var(--tape-blue); --tape-text: #FFFFFF; }
.tape-yellow { --tape-fill: var(--tape-yellow); }
.tape-green { --tape-fill: var(--tape-green); }
.tape-orange { --tape-fill: var(--tape-orange); }
.tape-black { --tape-fill: var(--tape-black); --tape-text: var(--tape-black-text); }
.tape-neutral { --tape-text: var(--ink); border: 1px solid var(--rule); }
.tape-neutral::before { background: var(--surface); }
.tape-closed { --tape-fill: var(--closed-fill); --tape-text: var(--ink-2); text-decoration: line-through; }

/* Transform-only on purpose: if an animation never runs (background tab, power saving,
   some in-app browsers) the tape must still be fully visible. */
.tape.settle { animation: tape-settle 160ms ease-out backwards; }
@keyframes tape-settle {
  from { transform: rotate(var(--tape-angle, -1.2deg)) scale(1.08); }
  to { transform: rotate(var(--tape-angle, -1.2deg)) scale(1); }
}
@media (min-width: 900px) {
  h1 { font-size: clamp(3.25rem, 4.5vw, 3.75rem); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

body {
  display: grid;
  min-height: 100vh;
  min-height: 100svh;
  align-items: center;
  justify-items: center;
  padding: 1.25rem;
  padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
    max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
}
.unlock-card {
  width: 100%;
  max-width: 36rem;
  padding: clamp(1.25rem, 5vw, 3.25rem);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: .75rem;
}
.unlock-card h1 { margin: 1rem 0 1.85rem; }
.unlock-mark { width: 2.75rem; min-height: .55rem; display: block; }
.password-label { display: grid; gap: .4rem; font-size: .94rem; font-weight: 600; }
.password-label input { min-height: 52px; }
.password-label input[aria-invalid="true"] { border-color: var(--accent-text); }
.remember-label { min-height: 44px; display: flex; gap: .65rem; align-items: center; margin: .5rem 0 .75rem; cursor: pointer; font-size: .89rem; }
.unlock-card button { width: 100%; background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 650; }
.unlock-card button:hover { border-color: var(--accent-text); }
#unlock-message { margin: .7rem 0 0; color: var(--accent-text); font-weight: 600; }
#unlock-message:empty { display: none; }

<script>function readerStorageKey(name) {
  return 'study-plan-library:' + window.location.pathname + ':' + name;
}

function readerStorageGet(name) {
  try {
    return window.localStorage.getItem(readerStorageKey(name));
  } catch (error) {
    return null;
  }
}

function readerStorageSet(name, value) {
  try {
    window.localStorage.setItem(readerStorageKey(name), value);
  } catch (error) {
    // The reader still works when persistent storage is unavailable.
  }
}

function readerStorageRemove(name) {
  try {
    window.localStorage.removeItem(readerStorageKey(name));
  } catch (error) {
    // Storage may be disabled by the browser or embedding app.
  }
}

function readerBytesFromBase64(value) {
  const bytes = atob(value);
  return Uint8Array.from(bytes, function (char) { return char.charCodeAt(0); });
}

function readerKeyToBase64(bytes) {
  return btoa(String.fromCharCode.apply(null, bytes));
}

async function deriveReaderKey(subtle, password, salt, iterations) {
  const material = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' }, material, 256);
  return new Uint8Array(bits);
}

    const counts = new Uint16Array(16);
    const offsets = new Uint16Array(16);
    const symbols = new Uint16Array(lengths.length);
    for (let i = 0; i < lengths.length; i++) {
      if (lengths[i]) counts[lengths[i]]++;
    }
    let remaining = 1;
    for (let length = 1; length <= 15; length++) {
      remaining = remaining * 2 - counts[length];
      if (remaining < 0) invalid();
      offsets[length] = offsets[length - 1] + counts[length - 1];
    }
    // Canonical codes order symbols by code length, then by symbol value.
    for (let symbol = 0; symbol < lengths.length; symbol++) {
      const length = lengths[symbol];
      if (length) symbols[offsets[length]++] = symbol;
    }
    return { counts: counts, symbols: symbols };
  }

  function readSymbol(tree) {
    let code = 0;
    let first = 0;
    let index = 0;
    for (let length = 1; length <= 15; length++) {
      code = (code << 1) | readBits(1);
      const count = tree.counts[length];
      if (code < first + count) return tree.symbols[index + code - first];
      index += count;
      first = (first + count) << 1;
    }
    invalid();
  }

  function fixedHuffmanTrees() {
    if (!fixedTrees) {
      const lengths = new Uint8Array(288);
      lengths.fill(8, 0, 144);
      lengths.fill(9, 144, 256);
      lengths.fill(7, 256, 280);
      lengths.fill(8, 280);
      fixedTrees = [huffman(lengths), huffman(new Uint8Array(32).fill(5))];
    }
    return fixedTrees;
  }

  function dynamicHuffmanTrees() {
    const literalCount = readBits(5) + 257;
    const distanceCount = readBits(5) + 1;
    const codeCount = readBits(4) + 4;
    if (literalCount > 286) invalid();
    const order = [16, 17, 18, 0, 8, 7, 9, 6, 10, 5, 11, 4, 12, 3, 13, 2, 14, 1, 15];
    const repeatBase = [3, 3, 11];
    const repeatBits = [2, 3, 7];
    const codeLengths = new Uint8Array(19);
    for (let i = 0; i < codeCount; i++) codeLengths[order[i]] = readBits(3);
    const codes = huffman(codeLengths);
    const lengths = new Uint8Array(literalCount + distanceCount);
    let index = 0;
    while (index < lengths.length) {
      const symbol = readSymbol(codes);
      if (symbol < 16) {
        lengths[index++] = symbol;
        continue;
      }
      if (symbol === 16 && index === 0) invalid();
      const length = symbol === 16 ? lengths[index - 1] : 0;
      const repeatCode = symbol - 16;
      const repeat = repeatBase[repeatCode] + readBits(repeatBits[repeatCode]);
      if (index + repeat > lengths.length) invalid();
      lengths.fill(length, index, index + repeat);
      index += repeat;
    }
    if (!lengths[256]) invalid();
    return [huffman(lengths.subarray(0, literalCount)), huffman(lengths.subarray(literalCount))];
  }

  function inflate(memberStart) {
    let final;
    do {
      final = readBits(1);
      const type = readBits(2);
      if (type === 0) {
        alignToByte();
        const length = readBits(16);
        if ((length ^ 0xffff) !== readBits(16) || offset + length > input.length) invalid();
        reserve(length);
        output.set(input.subarray(offset, offset + length), size);
        size += length;
        offset += length;
        continue;
      }
      if (type === 3) invalid();
      const [literals, distances] = type === 1 ? fixedHuffmanTrees() : dynamicHuffmanTrees();
      for (;;) {
        const symbol = readSymbol(literals);
        if (symbol === 256) break;
        if (symbol < 256) {
          reserve(1);
          output[size++] = symbol;
          continue;
        }
        const lengthCode = symbol - 257;
        if (lengthCode >= lengthBase.length) invalid();
        const length = lengthBase[lengthCode] + readBits(lengthExtra[lengthCode]);
        const distanceCode = readSymbol(distances);
        if (distanceCode >= distanceBase.length) invalid();
        const distance = distanceBase[distanceCode] + readBits(distanceExtra[distanceCode]);
        if (distance > size - memberStart) invalid();
        reserve(length);
        // Copy forward because a match can repeat bytes it has just written.
        let from = size - distance;
        const end = size + length;
        while (size < end) output[size++] = output[from++];
      }
    } while (!final);
    alignToByte();
  }

  do {
    if (readByte() !== 0x1f || readByte() !== 0x8b || readByte() !== 8) invalid();
    const flags = readByte();
    if (flags & 0xe0) invalid();
    offset += 6; // MTIME, XFL, OS
    if (flags & 4) {
      const extraLength = readBits(16);
      offset += extraLength;
    }
    if (flags & 8) {
      while (readByte() !== 0) { /* FNAME */ }
    }
    if (flags & 16) {
      while (readByte() !== 0) { /* FCOMMENT */ }
    }
    if (flags & 2) offset += 2; // FHCRC

    const memberStart = size;
    inflate(memberStart);
    offset += 4; // CRC32. AES-GCM already authenticated the compressed bytes.
    const expectedSize = readBits(16) + readBits(16) * 65536;
    if (((size - memberStart) >>> 0) !== expectedSize) invalid();
  } while (offset < input.length);
  return output.subarray(0, size);
}

async function decryptReaderDocument(subtle, rawKey, bundle) {
  const key = await subtle.importKey('raw', rawKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let content = await subtle.decrypt(
    { name: 'AES-GCM', iv: readerBytesFromBase64(bundle.iv), tagLength: 128 },
    key,
    readerBytesFromBase64(bundle.payload)
  );
  if (bundle.compression === 'gzip') {
    if (typeof DecompressionStream === 'function') {
      const stream = new Blob([content]).stream().pipeThrough(new DecompressionStream('gzip'));
      content = await new Response(stream).arrayBuffer();
    } else {
      content = gunzipReader(content);
    }
  }
  return new TextDecoder('utf-8', { fatal: true }).decode(content);
}

(function () {
  'use strict';

  const bundle = JSON.parse(document.getElementById('encrypted-reader').textContent);
  const form = document.getElementById('unlock-form');
  const password = document.getElementById('password');
  const remember = document.getElementById('remember');
  const submit = document.getElementById('unlock');
  const message = document.getElementById('unlock-message');
  const subtle = window.crypto && window.crypto.subtle;

  function busy(value) {
    submit.disabled = value;
    form.setAttribute('aria-busy', String(value));
    submit.textContent = value ? '正在解锁，约需几秒… / Unlocking…' : '解锁 / Unlock';
  }

  function displayReader(html) {
    password.value = '';
    document.open();
    document.write(html);
    document.close();
  }

  if (!subtle || typeof TextEncoder !== 'function' || typeof TextDecoder !== 'function') {
    form.hidden = true;
    document.getElementById('browser-help').hidden = false;
    return;
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    if (submit.disabled || !password.value) return;
    busy(true);
    message.textContent = '';
    password.removeAttribute('aria-invalid');
    let raw;
    let html;
    try {
      raw = await deriveReaderKey(subtle, password.value, readerBytesFromBase64(bundle.salt), bundle.iterations);
      html = await decryptReaderDocument(subtle, raw, bundle);
    } catch (error) {
      password.setAttribute('aria-invalid', 'true');
      message.textContent = '密码不正确 / Incorrect password';
      password.focus();
      password.select();
      busy(false);
      return;
    }
    if (remember.checked) readerStorageSet('unlock-key', readerKeyToBase64(raw));
    else readerStorageRemove('unlock-key');
    displayReader(html);
  });

  async function tryRememberedKey() {
    const saved = readerStorageGet('unlock-key');
    if (!saved) return;
    busy(true);
    let html;
    try {
      html = await decryptReaderDocument(subtle, readerBytesFromBase64(saved), bundle);
    } catch (error) {
      readerStorageRemove('unlock-key');
      busy(false);
      return;
    }
    displayReader(html);
  }

  tryRememberedKey();
}());
